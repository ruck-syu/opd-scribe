appId: in.opdscribe.app
productName: OPD Scribe
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
# Speech and AI engines, written by `node scripts/fetch-engines.mjs` (see docs/SPEECH_MODEL.md).
# ${os} is win|mac and ${arch} is x64|arm64, so each build copies only its own folder. Lands at
# process.resourcesPath/engines/{whisper,llm,llm-cpu}. Models (.bin/.gguf) are not bundled.
extraResources:
  - from: resources/engines/${os}-${arch}
    to: engines
# Space-free artifact names: GitHub rewrites spaces to dots on upload, which would
# make the published SHA256SUMS.txt unusable against the downloaded file names.
win:
  icon: build/icon.ico
  artifactName: OPD-Scribe-Setup-${version}.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  artifactName: OPD-Scribe-${version}-${arch}.${ext}
  target: [dmg]
  category: public.app-category.medical
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  entitlements: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: OPD Scribe records consultations and dictation for offline transcription on this computer.
