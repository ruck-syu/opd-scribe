<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OPD Scribe app icon: a clinical note with a microphone badge. Source for icon.png / icon.ico (npm run icons). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d7f9b"/>
      <stop offset="1" stop-color="#0d4656"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f08c00"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>

  <!-- note sheet with folded corner -->
  <path d="M318 190H600L710 300V742Q710 790 662 790H318Q270 790 270 742V238Q270 190 318 190Z" fill="#ffffff"/>
  <path d="M600 190V262Q600 300 638 300H710Z" fill="#b9dce7"/>

  <!-- text lines -->
  <g fill="#9fcddb">
    <rect x="334" y="352" width="224" height="38" rx="19"/>
    <rect x="334" y="432" width="312" height="38" rx="19"/>
    <rect x="334" y="512" width="280" height="38" rx="19"/>
    <rect x="334" y="592" width="160" height="38" rx="19"/>
  </g>

  <!-- microphone badge -->
  <circle cx="690" cy="730" r="168" fill="url(#badge)" stroke="#0f4b5c" stroke-width="28"/>
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round">
    <path d="M618 716a72 72 0 0 0 144 0"/>
    <path d="M690 790V826M650 826H730"/>
  </g>
  <rect x="656" y="622" width="68" height="126" rx="34" fill="#ffffff"/>
</svg>
